name: "Smart Release Please"
description: "Handles RC calculation on next and Stable promotion on main."

inputs:
  token:
    description: "GitHub Token (PAT)"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6 
      with:
        fetch-depth: 0
        token: ${{ inputs.token }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Calculate Correct RC Version
      id: calc_rc
      shell: bash
      run: python3 "${{ github.action_path }}/rc_align.py"

    # --- NEW STEP: PROMOTE RC TO STABLE ON MAIN ---
    # If we are on main, and the manifest contains an RC version (from the merge),
    # strip the RC suffix and commit. This forces Release Please to see the new stable version.
    - name: Promote RC Manifest to Stable
      if: github.ref_name == 'main' || github.ref_name == 'master'
      shell: bash
      run: |
        git config user.name "mapcolonies[bot]"
        git config user.email "devops[bot]@mapcolonies.com"
        
        # Read the version from the manifest
        CURRENT_MANIFEST_VER=$(grep -o '"\." *: *"[^"]*"' .release-please-manifest.json | cut -d'"' -f4)
        
        if [[ "$CURRENT_MANIFEST_VER" == *"-rc."* ]]; then
          # Strip the -rc part (e.g., 0.1.2-rc.13 -> 0.1.2)
          NEW_STABLE_VER=$(echo "$CURRENT_MANIFEST_VER" | sed 's/-rc.*//')
          
          echo "Promoting manifest from $CURRENT_MANIFEST_VER to $NEW_STABLE_VER"
          
          # Update the file
          sed -i "s/$CURRENT_MANIFEST_VER/$NEW_STABLE_VER/" .release-please-manifest.json
          
          # Commit and Push
          # We WANT this to trigger the workflow again, so we do NOT use [skip ci]
          git add .release-please-manifest.json
          git commit -m "chore: promote candidate $CURRENT_MANIFEST_VER to stable $NEW_STABLE_VER"
          git push "https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}.git" ${{ github.ref_name }}
          
          # Set flag to stop current run (the new run will handle the release)
          echo "SKIP_RELEASE=true" >> $GITHUB_ENV
        else
          echo "Manifest is already stable ($CURRENT_MANIFEST_VER). Proceeding."
        fi

    - name: Inject Release-As Footer
      if: >-
        ${{ 
          steps.calc_rc.outputs.next_version != '' &&
          github.ref_name != 'main' && github.ref_name != 'master' &&
          !contains(github.event.head_commit.message, 'Release-As:') &&
          !startsWith(github.event.head_commit.message, 'chore: release') &&
          ! (startsWith(github.event.head_commit.message, 'chore(') && contains(github.event.head_commit.message, '): release'))
        }}
      shell: bash
      run: |
        git config user.name "mapcolonies[bot]"
        git config user.email "devops[bot]@mapcolonies.com"

        TARGET_VER="${{ steps.calc_rc.outputs.next_version }}"
        
        # Loop Protection
        LAST_MSG=$(git log -1 --pretty=%B)
        if [[ "$LAST_MSG" == *"Release-As: $TARGET_VER"* ]]; then
          echo "Footer already present. Skipping push."
          exit 0
        fi

        git commit --allow-empty -m "chore: enforce correct rc version" -m "Release-As: $TARGET_VER"
        git push "https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}.git" ${{ github.ref_name }}

        echo "SKIP_RELEASE=true" >> $GITHUB_ENV

    - name: Close Stale Release PRs
      if: env.SKIP_RELEASE != 'true' && ${{ !contains(github.ref, 'release-please--branches') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        PR_DATA=$(gh pr list --base "${{ github.ref_name }}" --label "autorelease: pending" --json number,state --jq '.[0]')
        if [ -n "$PR_DATA" ] && [ "$PR_DATA" != "null" ]; then
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
          echo "Closing stale release PR #$PR_NUMBER..."
          gh pr close "$PR_NUMBER" --delete-branch
        fi

    - name: Run release-please
      if: env.SKIP_RELEASE != 'true'
      uses: googleapis/release-please-action@v4
      with:
        token: ${{ inputs.token }}
        target-branch: ${{ github.ref_name }}
        config-file: release-please-config.${{ github.ref_name }}.json
